<svg xmlns="http://www.w3.org/2000/svg" viewBox="297 298 430 430" role="img" aria-label="Flint">
  <!--
    Flint's large app icon (installed to a home screen, 180px and up).

    This is the full three-shard emblem, not the simplified favicon treatment: at
    this size there is room to read it, so nothing is dropped. All three shapes are
    the source paths, unmodified.

    The one deliberate change is the crop. The source emblem sits inside a 1024
    viewBox that the mark itself only fills about a third of, which is generous
    clear space in a header and wasted space in an icon. This frame is tightened to
    the mark's own bounds with a small margin, so the icon fills its tile the way an
    app icon is expected to.

    The background is included: an installed icon is composited by the OS and is not
    guaranteed to land on the app's own dark field, which is precisely the case the
    brand's self-contained variant is provided for.
  -->
  <path fill="#0F0D0B" d="M0 0H1024V1024H0Z"/>
  <g fill="#E3A73C">
    <path d="M676.44 348.915C678.618 349.494 683.322 358.919 684.562 361.267C691.921 375.206 699.807 388.73 707.782 402.319C677.095 420.351 646.239 438.093 615.218 455.545C625.416 461.859 636.106 467.556 646.295 474.057C638.664 489.153 628.942 505.549 620.48 520.271C608.351 513.152 595.597 506.178 583.31 499.267C565.636 489.226 548.018 479.088 530.457 468.852L530.37 370.387C546.092 369.498 567.856 370.075 584.01 370.016L584.045 401.578C614.931 384.643 645.72 366.353 676.44 348.915Z"/>
