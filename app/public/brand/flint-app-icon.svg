    <path d="M512.542 500.913C516.551 502.285 530.826 511.612 535.612 514.372C557.712 527.294 579.903 540.058 602.185 552.663C594.051 567.222 585.839 581.737 577.548 596.207C567.162 591.202 553.988 584.366 543.645 580.233C544.096 612.795 543.629 646.463 543.552 679.11C533.487 678.896 522.793 679.043 512.68 679.03C502.102 678.988 491.523 679.028 480.946 679.153L480.977 579.984C469.889 585.476 458.765 590.895 447.605 596.239C439.313 581.783 431.097 567.283 422.959 552.74C434.049 545.91 446.739 539.004 458.139 532.415L512.542 500.913Z"/>
