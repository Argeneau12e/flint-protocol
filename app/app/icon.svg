<svg xmlns="http://www.w3.org/2000/svg" viewBox="412 490 200 200" role="img" aria-label="Flint">
  <!--
    Flint's favicon: the simplified treatment of the emblem.

    The emblem is three shards separated by two diagonal gaps. At 16px those gaps
    fall below a pixel and the three shapes composite into an indistinct blob. This
    file takes the doc's own suggested route instead — a single dominant shape from
    the mark, cropped tight so it fills ~90% of the frame — and the result downscales
    to one clean, high-contrast glyph rather than three merging ones.

    Two things are this file's decision; the geometry is not.
      * the crop: the centred shard is isolated and the frame tightened to its own
        bounds, so no detail is lost to padding at small sizes;
      * the field: the mark's own background (#0F0D0B), not transparency. A browser
        tab is not guaranteed to be dark, which is exactly the case the brand's
        self-contained variant exists for.

    The path data is copied unmodified from the source emblem — no redrawing, no
    simplification of the curves themselves.

    The full three-shard mark is used everywhere it has room to be read: the header
    lockup and the large app icon.
  -->
  <path fill="#0F0D0B" d="M0 0H1024V1024H0Z"/>
  <path fill="#E3A73C" d="M512.542 500.913C516.551 502.285 530.826 511.612 535.612 514.372C557.712 527.294 579.903 540.058 602.185 552.663C594.051 567.222 585.839 581.737 577.548 596.207C567.162 591.202 553.988 584.366 543.645 580.233C544.096 612.795 543.629 646.463 543.552 679.11C533.487 678.896 522.793 679.043 512.68 679.03C502.102 678.988 491.523 679.028 480.946 679.153L480.977 579.984C469.889 585.476 458.765 590.895 447.605 596.239C439.313 581.783 431.097 567.283 422.959 552.74C434.049 545.91 446.739 539.004 458.139 532.415L512.542 500.913Z"/>
</svg>
