[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

# Devnet is the primary cluster for this build (FLINT_BUILD_CONTEXT.md Sections
# 6.3 and 12): all development, testing and demos happen there, and nothing here
# may ever point at mainnet.
#
# The localnet entry is kept alongside it so `anchor test --provider.cluster
# localnet` can run the Section 5 threat-model suite against a throwaway
# validator without editing this file.
[programs.devnet]
flint_escrow = "ziZiaCVcDaenoUP7jHdEPk4R2XJ8zeY5UbMPKFuqZxE"

[programs.localnet]
flint_escrow = "ziZiaCVcDaenoUP7jHdEPk4R2XJ8zeY5UbMPKFuqZxE"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Section 10 of the build context places the threat-model tests at
# programs/flint-escrow/tests/, not in a root-level tests/ directory, so the
# glob here is explicit rather than Anchor's default "tests/**/*.ts".
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"programs/flint-escrow/tests/**/*.ts\""

[hooks]
